# Contentor — home-server production stack.
#
# Fleet conventions: self-contained prod compose at repo root; one Caddy edge
# proxy (contentor-caddy) on the shared external `edge` network behind the
# Cloudflare tunnel; no published host ports; RAM + log caps on every service;
# restart: unless-stopped. Secrets come from .env.prod (passed via --env-file by
# deploy.sh). Internal service names are kept identical to the dev compose
# (django/redis/postgres/...) so app env (REDIS_URL, POSTGRES_HOST, the Next API
# URL fallback) carries over unchanged.
name: contentor

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    container_name: contentor-caddy
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging
    environment:
      - CONTENTOR_DOMAIN=${CONTENTOR_DOMAIN:-contentor.app}
      - FORWARDED_PROTO=https
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - internal
    depends_on:
      - django
      - nextjs-main
      - nextjs-customer
    healthcheck:
      # 127.0.0.1 (not localhost): busybox wget resolves localhost->::1 but the
      # admin API only listens on IPv4.
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    # Tuned to this container's mem_limit: shared_buffers ~25%, effective_cache_size
    # ~70%. Stock defaults (128MB / 4GB) ignore the cgroup entirely -- the 4GB cache
    # hint in particular skews the planner toward index scans no real cache backs.
    command: ["postgres", "-c", "shared_buffers=96MB", "-c", "effective_cache_size=256MB"]
    container_name: contentor-postgres
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contentor}
      POSTGRES_USER: ${POSTGRES_USER:-contentor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
      # Fleet monitoring: central postgres-exporter + Grafana RO datasource only.
      - observability
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contentor} -d ${POSTGRES_DB:-contentor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: contentor-redis
    restart: unless-stopped
    mem_limit: 160m
    logging: *logging
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru --save ""
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  django:
    build:
      context: ./backend
      args:
        # Prod ships Sentry/Prometheus and omits the dev test tooling.
        PIP_REQUIREMENTS: prod.txt
    container_name: contentor-django
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
    # --error-logfile -: worker lifecycle/crashes/timeouts to stdout. Access
    # logging is intentionally off (the 15s healthcheck would flood it); request
    # errors still surface via Django's django.request logger, and app-level
    # business events are logged explicitly.
    # gthread workers: several endpoint families block on slow external HTTP
    # (Anthropic Brand Pack, MailCraft, GetStream, Route53) for tens of seconds.
    # With plain sync workers, 2 such concurrent requests occupy BOTH workers and
    # take the whole platform down. Threads let a blocked request hold one thread
    # while the others keep serving (2 workers x 8 threads = 16 concurrent slots).
    # --timeout 300: the Design-with-AI icon turn stacks the Anthropic call
    # (client timeout 100s, max_retries=1 -> ~200s worst case) + Gemini image
    # generation ~60s; must not be killed mid-generation. Cloudflare still
    # caps the BROWSER's request at ~100s regardless — the long-term fix is
    # async/celery + polling.
    command: >
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --worker-class gthread
      --threads 8 --graceful-timeout 30 --timeout 300 --error-logfile -
    env_file: .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - SITE_QA_BROWSER_URL=http://browser:3000
      - CUTOUT_URL=http://cutout:7000
      - VIDEO_URL=http://video:7100
    networks:
      - internal
      - agentc
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Forwarded-Proto so SECURE_SSL_REDIRECT doesn't 301 the internal probe.
      test: ["CMD", "curl", "-fsS", "-H", "X-Forwarded-Proto: https", "http://localhost:8000/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      # 180s: the entrypoint's demo reseed can exceed 60s, which left django
      # "starting" past the window — celery (service_healthy) then never
      # started and needed a manual kick on both 2026-07-03 deploys.
      start_period: 180s

  celery-worker:
    build:
      context: ./backend
      args:
        PIP_REQUIREMENTS: prod.txt
    container_name: contentor-celery-worker
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    command: celery -A config.celery worker -l warning --concurrency=2
    env_file: .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - SITE_QA_BROWSER_URL=http://browser:3000
      - CUTOUT_URL=http://cutout:7000
    networks:
      - internal
      - agentc
      - scribe
    depends_on:
      django:
        condition: service_healthy

  # The team's runs (apps.core.copilot.runs) on their own queue, so a run
  # never waits behind a site build. Model calls are I/O-bound: one process,
  # a thread per run. The grace period lets a deploy finish most runs.
  celery-agents:
    build:
      context: ./backend
      args:
        PIP_REQUIREMENTS: prod.txt
    container_name: contentor-celery-agents
    restart: unless-stopped
    mem_limit: 384m
    stop_grace_period: 90s
    logging: *logging
    command: celery -A config.celery worker -Q agents -P threads -c 8 -l warning -n agents@%h
    env_file: .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    networks:
      - internal
      - agentc
    depends_on:
      django:
        condition: service_healthy

  # Headless Chromium for the site's final visual check
  # (apps.tenant_config.site_qa, off without ANTHROPIC_API_KEY); reached only
  # from inside the network.
  browser:
    build:
      context: ./infra/browser
    container_name: contentor-browser
    restart: unless-stopped
    init: true
    mem_limit: 1g
    logging: *logging
    environment:
      # From inside the network a tenant host is Caddy (TLS ends at Cloudflare).
      - HOST_RULES=MAP *.${CONTENTOR_DOMAIN:-contentor.app} caddy
    networks:
      - internal
    depends_on:
      - caddy

  # The photo studio's background remover (apps.media.photo_edits): rembg's
  # model (isnet-general-use, Apache-2.0) behind a tiny HTTP API (infra/cutout),
  # free per photo, reached only from inside the network. The model is baked
  # in at build. ~0.6 GB idle, ~1.5 GB for the few seconds a photo takes.
  cutout:
    build:
      context: ./infra/cutout
    container_name: contentor-cutout
    restart: unless-stopped
    init: true
    mem_limit: 3g
    logging: *logging
    environment:
      - OMP_NUM_THREADS=4
    networks:
      - internal

  # Reels (apps.reels): finding a video's moments and rendering them, one job at
  # a time per node, on their own queue so a render never holds up the site's
  # other jobs. It asks Scribe for a video's words (scribe) and the model for
  # its moments (agentc); the grace period lets a deploy finish a render.
  celery-video:
    build:
      context: ./backend
      args:
        PIP_REQUIREMENTS: prod.txt
    container_name: contentor-celery-video
    restart: unless-stopped
    mem_limit: 384m
    stop_grace_period: 120s
    logging: *logging
    command: celery -A config.celery worker -Q video -c 1 -l warning -n video@%h
    env_file: .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - SITE_QA_BROWSER_URL=http://browser:3000
      - VIDEO_URL=http://video:7100
    networks:
      - internal
      - agentc
      - scribe
    depends_on:
      django:
        condition: service_healthy

  # The reels' video service (apps.reels): ffmpeg and a face detector behind a
  # tiny HTTP API (infra/video), reached only from inside the network. It reads
  # the video from storage and uploads the reel there, so it needs the internet
  # (the internal network has it). ~60 MB idle; a render takes VIDEO_THREADS
  # cores (capped by cpus, so the site keeps the rest) and ~0.5 GB for the
  # seconds it runs.
  video:
    build:
      context: ./infra/video
    container_name: contentor-video
    restart: unless-stopped
    init: true
    mem_limit: 2g
    cpus: 6
    logging: *logging
    environment:
      - VIDEO_THREADS=6
    networks:
      - internal

  celery-beat:
    build:
      context: ./backend
      args:
        PIP_REQUIREMENTS: prod.txt
    container_name: contentor-celery-beat
    restart: unless-stopped
    mem_limit: 160m
    logging: *logging
    command: celery -A config.celery beat -l warning
    env_file: .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    networks:
      - internal
    depends_on:
      - celery-worker

  vector:
    image: timberio/vector:0.46.1-alpine
    container_name: contentor-vector
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - vector_data:/var/lib/vector
    command: --config /etc/vector/vector.yaml
    environment:
      - LOGS_INGEST_TOKEN=${LOGS_INGEST_TOKEN:?LOGS_INGEST_TOKEN required in .env.prod}
    networks:
      - internal
    depends_on:
      django:
        condition: service_healthy

  nextjs-main:
    build:
      context: .
      dockerfile: frontend-main/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://django:8000}
        NEXT_PUBLIC_BASE_DOMAIN: ${CONTENTOR_DOMAIN:-contentor.app}
    container_name: contentor-nextjs-main
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://django:8000}
      - NEXT_PUBLIC_BASE_DOMAIN=${CONTENTOR_DOMAIN:-contentor.app}
    networks:
      - internal
    depends_on:
      - django

  nextjs-customer:
    build:
      context: .
      dockerfile: frontend-customer/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://django:8000}
        NEXT_PUBLIC_BASE_DOMAIN: ${CONTENTOR_DOMAIN:-contentor.app}
    container_name: contentor-nextjs-customer
    restart: unless-stopped
    mem_limit: 320m
    logging: *logging
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://django:8000}
      - NEXT_PUBLIC_BASE_DOMAIN=${CONTENTOR_DOMAIN:-contentor.app}
    networks:
      - internal
    depends_on:
      - django

networks:
  # Shared with the cloudflared tunnel — created once on the host:
  #   docker network create edge
  edge:
    external: true
  internal:
    driver: bridge
  # Fleet monitoring net; created once: `docker network create observability`
  observability:
    external: true
  # The Agent Container hub (AI_PROVIDER=agentc reaches it as
  # http://agent-container-hub:39300). Exists on every fleet node; the hub
  # container itself runs on acemagic only.
  agentc:
    name: agent-container_default
    external: true
  # Scribe, the captions service (SCRIBE_URL=http://scribe-api:8000): its API
  # runs on acemagic; the network exists on every fleet node, and prodesk
  # reaches scribe-api over fleet-contentor's attach.
  scribe:
    external: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  vector_data:
